name: Build Smart HTML APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'HTML2APK Builder'
      package_id:
        description: 'Package ID (lowercase English only)'
        required: true
        default: 'com.app.html2apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/smart/webview
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            python3 -c "import zlib,struct;w=h=192;raw=b''.join(b'\x00'+b'\x10\xb9\x81\xff'*w for _ in range(h));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff);open('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartWebViewApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.smart.webview'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.inputs.package_id }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name="com.smart.webview.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/smart/webview/MainActivity.java
          package com.smart.webview;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) s.setForceDark(WebSettings.FORCE_DARK_OFF);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) s.setAlgorithmicDarkeningAllowed(false);

                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidNative");
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> fp, FileChooserParams p) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = fp;
                          try {
                              startActivityForResult(p.createIntent(), FILE_CHOOSER_REQUEST_CODE);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView v, String u) {
                          v.evaluateJavascript("window.print=function(){AndroidNative.printPage();};if(!navigator.share){navigator.share=function(d){AndroidNative.shareText(d.title||'',d.text||'',d.url||'');return Promise.resolve();};}", null);
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("https://wa.me") || u.startsWith("whatsapp:") || u.startsWith("mailto:") || u.startsWith("tel:")) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u)));
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_CHOOSER_REQUEST_CODE && filePathCallback != null) {
                      Uri[] r = (res == Activity.RESULT_OK && data != null && data.getDataString() != null) ? new Uri[]{Uri.parse(data.getDataString())} : null;
                      filePathCallback.onReceiveValue(r);
                      filePathCallback = null;
                  } else super.onActivityResult(req, res, data);
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void printPage() {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                          pm.print("Siparis_PDF", webView.createPrintDocumentAdapter("Document"), new PrintAttributes.Builder().build());
                      });
                  }
                  @JavascriptInterface
                  public void shareText(String t, String x, String u) {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_SUBJECT, t);
                          i.putExtra(Intent.EXTRA_TEXT, x + (u.isEmpty() ? "" : "\n" + u));
                          startActivity(Intent.createChooser(i, "Share"));
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
