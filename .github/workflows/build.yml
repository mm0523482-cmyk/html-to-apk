<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>HTML2APK Builder</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

body {
  background: #f1f5f9;
  margin: 0;
  padding: 15px;
  color: #0f172a;
}

.card {
  max-width: 520px;
  margin: 0 auto;
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
  margin: 0 0 6px;
  font-size: 21px;
  text-align: center;
}

.sub {
  margin: 0 0 20px;
  font-size: 13px;
  color: #64748b;
  text-align: center;
}

.group {
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
  color: #334155;
}

input[type=text],
input[type=password],
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  direction: ltr;
  text-align: left;
}

input[type=file] {
  width: 100%;
  padding: 10px;
  border: 2px dashed #94a3b8;
  border-radius: 8px;
  background: #f8fafc;
}

textarea {
  min-height: 110px;
  font-family: monospace;
  font-size: 12px;
}

.icon-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-preview {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  object-fit: cover;
  background: #10b981;
}

.token-box {
  background: #fffbeb;
  border: 1px solid #fde68a;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 6px;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.btn-build {
  background: #10b981;
  color: white;
}

.btn-download {
  display: none;
  background: #2563eb;
  color: white;
  text-decoration: none;
  text-align: center;
  padding: 14px;
  border-radius: 10px;
  margin-top: 12px;
  font-weight: bold;
}

.status {
  display: none;
  margin-top: 15px;
  padding: 13px;
  border-radius: 8px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  font-size: 13px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.progress {
  display: none;
  width: 100%;
  height: 9px;
  background: #e2e8f0;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 12px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #10b981;
  transition: width .4s;
}

.note {
  font-size: 11px;
  color: #64748b;
  line-height: 1.7;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="card">

<h1>🏭 محوّل HTML إلى APK</h1>

<p class="sub">
مصنعك السحابي لتحويل صفحات HTML إلى تطبيقات Android
</p>

<div class="token-box">

<label>GitHub Personal Access Token</label>

<input
type="password"
id="ghToken"
placeholder="أدخل GitHub Token"
autocomplete="off"
>

<p class="note">
يُستخدم الرمز للاتصال بمستودعك. لا تشارك الرمز مع أي شخص ولا تحفظه في موقع عام غير موثوق.
</p>

</div>

<div class="group">

<label>1. اختر ملف HTML من هاتفك</label>

<input
type="file"
id="htmlFile"
accept=".html,.htm,text/html"
>

</div>

<div class="group">

<label>أو الصق كود HTML مباشرة</label>

<textarea
id="htmlCode"
placeholder="<!DOCTYPE html>..."
></textarea>

</div>

<div class="group">

<label>2. أيقونة التطبيق (اختياري)</label>

<div class="icon-row">

<img
id="iconPreview"
class="icon-preview"
alt="معاينة الأيقونة"
src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2310b981'/%3E%3Ctext x='50' y='60' font-size='30' text-anchor='middle' fill='white'%3EAPK%3C/text%3E%3C/svg%3E"
>

<input
type="file"
id="iconFile"
accept="image/png,image/jpeg,image/webp"
>

</div>
</div>

<div class="group">

<label>3. اسم التطبيق</label>

<input
type="text"
id="appName"
value="My HTML App"
placeholder="My Application"
maxlength="50"
>

</div>

<div class="group">

<label>4. معرف الحزمة Package ID</label>

<input
type="text"
id="pkgId"
value="com.app.html2apk"
placeholder="com.app.example"
>

<p class="note">
مثال: com.app.myapplication
</p>

</div>

<button
type="button"
class="btn-build"
id="buildBtn"
>
🚀 تحويل وبناء APK الآن
</button>

<div class="progress" id="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="status" id="statusBox"></div>

<a
id="downloadLink"
class="btn-download"
target="_blank"
rel="noopener noreferrer"
>
⬇️ فتح صفحة تحميل APK
</a>

</div>

<script>
"use strict";

/* إعدادات المستودع */

const OWNER = "mm0523482-cmyk";
const REPO = "html-to-apk";
const WORKFLOW = "build.yml";
const BRANCH = "main";

const API = "https://api.github.com";

let customIconB64 = null;
let buildRunning = false;

/* عناصر الصفحة */

const $ = id => document.getElementById(id);

const tokenInput = $("ghToken");
const htmlFile = $("htmlFile");
const htmlCode = $("htmlCode");
const iconFile = $("iconFile");
const appNameInput = $("appName");
const pkgInput = $("pkgId");
const buildBtn = $("buildBtn");
const statusBox = $("statusBox");
const downloadLink = $("downloadLink");
const progress = $("progress");
const progressBar = $("progressBar");

/* عرض الحالة */

function log(message) {
  statusBox.style.display = "block";
  statusBox.textContent = message;
}

function setProgress(value) {
  progress.style.display = "block";
  progressBar.style.width = Math.min(100, Math.max(0, value)) + "%";
}

/* قراءة ملف HTML */

htmlFile.addEventListener("change", async function() {

  const file = this.files[0];

  if (!file) return;

  if (file.size > 10 * 1024 * 1024) {
    log("حجم ملف HTML كبير جداً. الحد الأقصى 10 ميجابايت.");
    return;
  }

  htmlCode.value = await file.text();

  const name = file.name
    .replace(/\.[^/.]+$/, "")
    .replace(/[^a-zA-Z0-9 ]/g, " ")
    .trim();

  if (name) {
    appNameInput.value = name;

    pkgInput.value =
      "com.app." +
      name.toLowerCase().replace(/[^a-z0-9]/g, "") +
      Math.floor(10 + Math.random() * 89);
  }

});

/* قراءة الأيقونة وتحويلها إلى PNG */

iconFile.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    log("الملف المختار ليس صورة.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {

    const img = new Image();

    img.onload = function() {

      const canvas = document.createElement("canvas");

      canvas.width = 512;
      canvas.height = 512;

      const ctx = canvas.getContext("2d");

      const scale = Math.max(
        512 / img.width,
        512 / img.height
      );

      const width = img.width * scale;
      const height = img.height * scale;

      ctx.drawImage(
        img,
        (512 - width) / 2,
        (512 - height) / 2,
        width,
        height
      );

      const dataURL = canvas.toDataURL("image/png");

      $("iconPreview").src = dataURL;

      customIconB64 = dataURL.split(",")[1];

    };

    img.onerror = () => log("تعذر قراءة الصورة.");

    img.src = event.target.result;

  };

  reader.readAsDataURL(file);

});

/* ترميز UTF-8 إلى Base64 */

function utf8ToB64(str) {

  const bytes = new TextEncoder().encode(str);

  let binary = "";

  for (const byte of bytes) {
    binary += String.fromCharCode(byte);
  }

  return btoa(binary);

}

/* طلب GitHub API */

async function githubRequest(path, options = {}, token) {

  const response = await fetch(API + path, {

    ...options,

    headers: {

      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      "Content-Type": "application/json",

      ...(options.headers || {})

    }

  });

  if (!response.ok) {

    let detail = "";

    try {
      const data = await response.json();
      detail = data.message || "";
    } catch {}

    throw new Error(
      "GitHub API Error (" +
      response.status +
      "): " +
      detail
    );

  }

  if (response.status === 204) return null;

  return response.json();

}

/* رفع ملف أو تحديثه */

async function upsertFile(path, content, message, token) {

  let sha = null;

  const encodedPath = path
    .split("/")
    .map(encodeURIComponent)
    .join("/");

  const getUrl =
    `/repos/${OWNER}/${REPO}/contents/${encodedPath}`;

  try {

    const existing = await githubRequest(
      getUrl,
      { method: "GET" },
      token
    );

    sha = existing.sha;

  } catch (error) {

    if (!error.message.includes("(404)")) {
      throw error;
    }

  }

  const body = {
    message,
    content
  };

  if (sha) body.sha = sha;

  await githubRequest(
    getUrl,
    {
      method: "PUT",
      body: JSON.stringify(body)
    },
    token
  );

}

/* حذف الأيقونة القديمة عند عدم اختيار أيقونة جديدة */

async function deleteOldIcon(token) {

  try {

    const existing = await githubRequest(
      `/repos/${OWNER}/${REPO}/contents/icon.png`,
      { method: "GET" },
      token
    );

    await githubRequest(
      `/repos/${OWNER}/${REPO}/contents/icon.png`,
      {
        method: "DELETE",
        body: JSON.stringify({
          message: "Remove old custom icon",
          sha: existing.sha,
          branch: BRANCH
        })
      },
      token
    );

  } catch (error) {

    if (!error.message.includes("(404)")) {
      throw error;
    }

  }

}

/* انتظار */

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* بدء عملية البناء */

async function startBuild() {

  if (buildRunning) return;

  const token = tokenInput.value.trim();

  const code = htmlCode.value;

  const appName =
    appNameInput.value.trim() || "My HTML App";

  const pkgId = pkgInput.value.trim().toLowerCase();

  if (!token) {
    alert("أدخل GitHub Token أولاً.");
    return;
  }

  if (!code.trim()) {
    alert("اختر ملف HTML أو الصق الكود.");
    return;
  }

  if (code.length > 10 * 1024 * 1024) {
    alert("حجم كود HTML أكبر من الحد المسموح.");
    return;
  }

  if (!/^[a-zA-Z0-9_-]+$/.test(appName)) {
    if (appName.length > 50) {
      alert("اسم التطبيق طويل جداً.");
      return;
    }
  }

  if (!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(pkgId)) {
    alert("Package ID غير صحيح. مثال: com.app.example");
    return;
  }

  buildRunning = true;

  buildBtn.disabled = true;
  downloadLink.style.display = "none";

  setProgress(5);

  try {

    log("1/5: التحقق من مستودع GitHub...");

    const repository = await githubRequest(
      `/repos/${OWNER}/${REPO}`,
      { method: "GET" },
      token
    );

    if (repository.archived) {
      throw new Error("المستودع مؤرشف ولا يمكن تعديله.");
    }

    setProgress(10);

    log("2/5: رفع ملف HTML...");

    await upsertFile(
      "index.html",
      utf8ToB64(code),
      "Update HTML application",
      token
    );

    setProgress(30);

    log("3/5: رفع الأيقونة...");

    if (customIconB64) {

      await upsertFile(
        "icon.png",
        customIconB64,
        "Update application icon",
        token
      );

    } else {

      await deleteOldIcon(token);

    }

    setProgress(45);

    log("4/5: تشغيل GitHub Actions...");

    const startedAt = Date.now();

    await githubRequest(
      `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
      {
        method: "POST",
        body: JSON.stringify({
          ref: BRANCH,
          inputs: {
            app_name: appName,
            package_id: pkgId
          }
        })
      },
      token
    );

    log("تم إرسال طلب البناء. نبحث عن عملية البناء الجديدة...");

    let run = null;

    /* البحث عن عملية البناء الجديدة */

    for (let i = 0; i < 12; i++) {

      await sleep(5000);

      const data = await githubRequest(
        `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=20`,
        { method: "GET" },
        token
      );

      run = data.workflow_runs.find(item => {

        return new Date(item.created_at).getTime()
          >= startedAt - 30000;

      });

      if (run) break;

    }

    if (!run) {
      throw new Error(
        "لم يتم العثور على عملية البناء الجديدة. تحقق من إعداد build.yml وصلاحيات Actions."
      );
    }

    const runId = run.id;

    const runUrl = run.html_url;

    log("5/5: جاري بناء تطبيق Android...");

    setProgress(55);

    /* متابعة البناء */

    for (let i = 0; i < 120; i++) {

      await sleep(5000);

      const check = await githubRequest(
        `/repos/${OWNER}/${REPO}/actions/runs/${runId}`,
        { method: "GET" },
        token
      );

      if (check.status === "completed") {

        if (check.conclusion === "success") {

          const artifacts = await githubRequest(
            `/repos/${OWNER}/${REPO}/actions/runs/${runId}/artifacts`,
            { method: "GET" },
            token
          );

          const apk = artifacts.artifacts.find(item => {
            return !item.expired &&
              (item.name.toLowerCase().includes("apk") ||
               item.name.toLowerCase().includes("release"));
          });

          if (!apk) {
            throw new Error(
              "نجح البناء لكن لم يتم العثور على Artifact باسم APK أو Release. راجع إعدادات build.yml."
            );
          }

          log(
            "✅ اكتمل بناء التطبيق بنجاح!\n" +
            "اسم التطبيق: " + appName + "\n" +
            "Package ID: " + pkgId + "\n" +
            "ملف APK موجود ضمن Artifacts.\n" +
            "افتح صفحة البناء لتحميله."
          );

          downloadLink.href = runUrl;
          downloadLink.style.display = "block";

          setProgress(100);

          return;

        }

        throw new Error(
          "فشل بناء التطبيق. النتيجة: " +
          (check.conclusion || "غير معروفة") +
          "\nافتح سجل GitHub Actions لمعرفة السبب."
        );

      }

      const percent = Math.min(
        95,
        55 + Math.floor((i / 120) * 40)
      );

      setProgress(percent);

      log(
        "🔨 جاري بناء APK...\n" +
        "حالة البناء: " + check.status + "\n" +
        "النتيجة: " + (check.conclusion || "قيد التنفيذ") +
        "\nرقم العملية: " + runId
      );

    }

    throw new Error(
      "انتهت مدة الانتظار. يمكنك متابعة عملية البناء من صفحة GitHub Actions."
    );

  } catch (error) {

    log("❌ حدث خطأ:\n" + error.message);

  } finally {

    buildRunning = false;
    buildBtn.disabled = false;

  }

}

/* ربط الزر */

buildBtn.addEventListener("click", startBuild);

</script>

</body>
</html>
