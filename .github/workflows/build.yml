name: Build Smart HTML APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'My Smart App'
      package_id:
        description: 'Package ID (lowercase English only)'
        required: true
        default: 'com.app.smart1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/smart/webview
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/drawable/ic_launcher.png
          else
            python3 -c "import zlib,struct;w=h=192;raw=b''.join(b'\x00'+b'\x10\xb9\x81\xff'*w for _ in range(h));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff);open('app/src/main/res/drawable/ic_launcher.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartWebViewApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.smart.webview'
              compileSdk 34
              defaultConfig {
                  applicationId "${{ github.event.inputs.package_id }}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
          </resources>
          EOF

          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          cat << 'EOF' > app/src/main/java/com/smart/webview/MainActivity.java
          package com.smart.webview;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      settings.setForceDark(WebSettings.FORCE_DARK_OFF);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      settings.setAlgorithmicDarkeningAllowed(false);
                  }

                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidNative");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          String injectJs = "window.print = function() { AndroidNative.printPage(); };" +
                              "if (!navigator.share) { navigator.share = function(data) { " +
                              "AndroidNative.shareText(data.title || '', data.text || '', data.url || '');" +
                              "return Promise.resolve(); }; }";
                          view.evaluateJavascript(injectJs, null);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("intent://")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  if (intent != null) {
                                      startActivity(Intent.createChooser(intent, "Share"));
                                      return true;
                                  }
                              } catch (Exception e) { return true; }
                          } else if (url.startsWith("https://wa.me") || url.startsWith("whatsapp:") || url.startsWith("mailto:") || url.startsWith("tel:")) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void printPage() {
                      runOnUiThread(() -> {
                          PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                          PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("Document");
                          printManager.print("Siparis_PDF", adapter, new PrintAttributes.Builder().build());
                      });
                  }

                  @JavascriptInterface
                  public void shareText(String title, String text, String url) {
                      runOnUiThread(() -> {
                          String fullText = text + (url.isEmpty() ? "" : "\n" + url);
                          Intent sendIntent = new Intent(Intent.ACTION_SEND);
                          sendIntent.setType("text/plain");
                          sendIntent.putExtra(Intent.EXTRA_SUBJECT, title);
                          sendIntent.putExtra(Intent.EXTRA_TEXT, fullText);
                          startActivity(Intent.createChooser(sendIntent, "Share"));
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
