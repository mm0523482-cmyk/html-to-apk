<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML2APK Builder</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f1f5f9;margin:0;padding:15px;color:#0f172a}
.card{max-width:520px;margin:0 auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:21px;color:#0f172a;text-align:center}
p.sub{margin:0 0 18px;font-size:13px;color:#64748b;text-align:center}
.group{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px;color:#334155}
input[type=text],input[type=password],textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;direction:ltr;text-align:left}
input[type=file]{width:100%;padding:10px;border:2px dashed #94a3b8;border-radius:8px;background:#f8fafc;font-size:13px}
textarea{min-height:80px;font-family:monospace;font-size:12px}
.icon-row{display:flex;align-items:center;gap:12px}
.icon-preview{width:54px;height:54px;border-radius:12px;border:1px solid #cbd5e1;object-fit:cover;background:#10b981;flex-shrink:0}
button{width:100%;padding:14px;font-size:16px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;margin-top:6px}
.btn-build{background:#10b981;color:#fff}
.btn-build:disabled{background:#94a3b8;cursor:not-allowed}
.btn-dl{background:#2563eb;color:#fff;display:none;margin-top:12px;text-align:center;text-decoration:none;padding:14px;border-radius:10px;font-weight:bold}
.status{margin-top:14px;padding:12px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px;line-height:1.6;display:none}
.token-box{background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:8px;margin-bottom:14px}
</style>
</head>
<body>
<div class="card">
<h1>🏭 محوّل HTML إلى APK</h1>
<p class="sub">نسختك الشخصية المصلحة — تحويل حقيقي مع أيقونة مخصصة</p>

<div class="token-box">
<label>مفتاح الاتصال (GitHub Token):</label>
<input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
</div>

<div class="group">
<label>1. اختر ملف HTML من هاتفك:</label>
<input type="file" id="htmlFile" accept=".html,.htm,text/html">
</div>

<div class="group">
<label>أو الصق كود HTML هنا مباشرة:</label>
<textarea id="htmlCode" placeholder="<!DOCTYPE html>..."></textarea>
</div>

<div class="group">
<label>2. أيقونة التطبيق (اختياري - صورة من المعرض):</label>
<div class="icon-row">
<img id="iconPreview" class="icon-preview" src="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Ctext x='50' y='62' font-size='42' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EAPK%3C/text%3E%3C/svg%3E">
<input type="file" id="iconFile" accept="image/*">
</div>
</div>

<div class="group">
<label>3. اسم التطبيق (App Name):</label>
<input type="text" id="appName" value="My Smart App" placeholder="Isicam Siparis">
</div>

<div class="group">
<label>4. معرف الحزمة (Package ID - إنجليزي صغير بدون مسافات):</label>
<input type="text" id="pkgId" value="com.app.smart1" placeholder="com.app.isicam">
</div>

<button type="button" class="btn-build" id="buildBtn" onclick="startBuild()">🚀 تحويل وبناء APK الآن</button>
<div class="status" id="statusBox"></div>
<a id="downloadLink" class="btn-dl" target="_blank">⬇️ فتح صفحة تحميل الـ APK الجاهز</a>
</div>

<script>
const OWNER = "mm0523482-cmyk";
const REPO = "html-to-apk";
const WORKFLOW = "build.yml";
const API = "https://github.com";
let customIconB64 = null;

window.onload = () => {
  const saved = localStorage.getItem("gh_apk_token");
  if (saved) document.getElementById("ghToken").value = saved;
};

document.getElementById("htmlFile").addEventListener("change", function(e) {
  const file = e.target.files.item(0);
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { document.getElementById("htmlCode").value = ev.target.result; };
  reader.readAsText(file);
  const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[^a-zA-Z0-9 ]/g, " ").trim();
  if (cleanName) {
    document.getElementById("appName").value = cleanName;
    document.getElementById("pkgId").value = "com.app." + cleanName.toLowerCase().replace(/[^a-z0-9]/g, "") + Math.floor(10 + Math.random()*89);
  }
});

document.getElementById("iconFile").addEventListener("change", function(e) {
  const file = e.target.files.item(0);
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 192;
      canvas.height = 192;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, 192, 192);
      const dataUrl = canvas.toDataURL("image/png");
      document.getElementById("iconPreview").src = dataUrl;
      customIconB64 = dataUrl.substring(dataUrl.indexOf(",") + 1);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function log(msg) {
  const box = document.getElementById("statusBox");
  box.style.display = "block";
  box.innerHTML = msg;
}

async function upsertFile(path, base64Content, msg, headers) {
  let sha = undefined;
  const getRes = await fetch(`${API}/repos/${OWNER}/${REPO}/contents/${path}`, { headers });
  if (getRes.ok) {
    const getData = await getRes.json();
    sha = getData.sha;
  }
  const body = { message: msg, content: base64Content };
  if (sha) body.sha = sha;
  const putRes = await fetch(`${API}/repos/${OWNER}/${REPO}/contents/${path}`, {
    method: "PUT",
    headers,
    body: JSON.stringify(body)
  });
  if (!putRes.ok) throw new Error("فشل رفع الملف: " + path);
}

async function startBuild() {
  const token = document.getElementById("ghToken").value.trim();
  const code = document.getElementById("htmlCode").value.trim();
  const appName = document.getElementById("appName").value.trim() || "Smart App";
  const pkgId = document.getElementById("pkgId").value.trim().toLowerCase().replace(/[^a-z0-9.]/g, "") || "com.app.smart";

  if (!token.startsWith("ghp_") && !token.startsWith("github_pat_")) {
    alert("يرجى لصق رمز GitHub Token الصحيح أولاً!");
    return;
  }
  if (!code) {
    alert("يرجى اختيار ملف HTML أو لصق الكود أولاً!");
    return;
  }

  localStorage.setItem("gh_apk_token", token);
  const btn = document.getElementById("buildBtn");
  const dl = document.getElementById("downloadLink");
  btn.disabled = true;
  dl.style.display = "none";

  const headers = {
    "Authorization": "Bearer " + token,
    "Accept": "application/vnd.github+json",
    "Content-Type": "application/json"
  };

  try {
    const startTime = Date.now() - 5000;
    log("⏳ 1/4 جاري رفع ملف HTML والأيقونة إلى GitHub...");
    await upsertFile("index.html", utf8ToB64(code), "Update index.html", headers);

    if (customIconB64) {
      await upsertFile("icon.png", customIconB64, "Update app icon", headers);
    } else {
      const checkIcon = await fetch(`${API}/repos/${OWNER}/${REPO}/contents/icon.png`, { headers });
      if (checkIcon.ok) {
        const iconData = await checkIcon.json();
        await fetch(`${API}/repos/${OWNER}/${REPO}/contents/icon.png`, {
          method: "DELETE",
          headers,
          body: JSON.stringify({ message: "Remove old icon", sha: iconData.sha })
        });
      }
    }

    log("⚙️ 2/4 جاري تشغيل محرك البناء في GitHub Actions...");
    const dispRes = await fetch(`${API}/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
      method: "POST",
      headers,
      body: JSON.stringify({
        ref: "main",
        inputs: { app_name: appName, package_id: pkgId }
      })
    });
    if (!dispRes.ok) throw new Error("فشل تشغيل البناء — تأكد من صلاحية Token (workflow).");

    log("🔍 3/4 جاري تحديد عملية البناء الجديدة...");
    let targetRun = null;
    for (let w = 0; w < 10; w++) {
      await new Promise(r => setTimeout(r, 3000));
      const runsRes = await fetch(`${API}/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=5`, { headers });
      const runsData = await runsRes.json();
      targetRun = runsData.workflow_runs.find(r => new Date(r.created_at).getTime() >= startTime);
      if (targetRun) break;
    }
    if (!targetRun) throw new Error("لم يتم العثور على العملية الجديدة، افتح تبويب Actions يدوياً.");

    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 4000));
      const checkRes = await fetch(`${API}/repos/${OWNER}/${REPO}/actions/runs/${targetRun.id}`, { headers });
      const checkData = await checkRes.json();
      if (checkData.status === "completed") {
        if (checkData.conclusion === "success") {
          const artRes = await fetch(`${API}/repos/${OWNER}/${REPO}/actions/runs/${targetRun.id}/artifacts`, { headers });
          const artData = await artRes.json();
          if (artData.artifacts && artData.artifacts.length > 0) {
            log("✅ <b>تم إنتاج ملف APK الحقيقي بنجاح!</b><br>اضغط على الزر الأزرق بالأسفل ثم انزل لقسم <b>Artifacts</b> لتحميله.");
            dl.href = targetRun.html_url;
            dl.style.display = "block";
          } else {
            log("❌ اكتمل البناء لكن لم يتم العثور على ملف APK في Artifacts.");
          }
        } else {
          log("❌ فشل البناء أثناء التجميع. افتح السجل للتفاصيل: <a href='" + targetRun.html_url + "' target='_blank'>عرض الخطأ</a>");
        }
        btn.disabled = false;
        return;
      }
      log(`🔨 4/4 جاري تجميع ملف APK الحقيقي... (${(i+1)*4 + 6} ثانية)`);
    }
  } catch (err) {
    log("❌ خطأ: " + err.message);
  }
  btn.disabled = false;
}
  btn.disabled = false;
}
</script>
</body>
</html>
